# Specifications as published by 3Rivers Archery, 25 August 2026.
# Nothing here was measured on our own bench.
#
# The listing does not name a manufacturer behind the Ghost brand, so `maker`
# records the brand and nothing more. It is not treated as unknown, and it is
# not guessed at either.
#
# This is the only bow on the page whose seller publishes how far the marked
# draw weight moves with draw length: about 2.5 lb per inch either side of 28
# in. That is the same class of correction the SAS Spirit needed, published up
# front rather than buried on a different page.
