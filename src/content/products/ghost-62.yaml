# Specifications as published by 3Rivers Archery, 25 August 2026.
# Nothing here was measured on our own bench.
#
# The Ghost is a 3Rivers Archery house brand. A customer asked on the product
# page whether Southwest Archery makes it, and a Verified Reply from 3Rivers
# staff answered: "Yes, this is a new item, it is made for us overseas."
#
# So it is made FOR 3Rivers, not BY them, and the answer does not confirm
# Southwest Archery as the manufacturer. The contract manufacturer is not
# named anywhere on the listing. `maker` records what is actually established.
#
# Three figures below come from that Verified Reply Q&A rather than the
# specification, and are marked `retailer` to keep the two apart. A staff
# recommendation in a question thread is not a published spec.
#
# This is the only bow on the page whose seller publishes how far the marked
# draw weight moves with draw length: about 2.5 lb per inch either side of 28
# in. That is the same class of correction the SAS Spirit needed, published up
# front rather than buried on a different page.
name: Ghost 62" Takedown Recurve Bow
maker: Ghost, a 3Rivers Archery house brand made overseas
category: bow
price:
  value: 179.99
  currency: USD
  source: retailer
  retailer: 3Rivers Archery
  checked_on: 2026-08-25
specs:
  - label: Length
    value: 62 in. The listing states a 19 1/4 in riser and no AMO figure
    source: maker
  - label: Draw weight
    value: 25 to 60 lb in 5 lb steps at 28 in, moving about 2.5 lb per inch either side. Availability varies by hand
    source: maker
  - label: Takedown
    value: "Yes, published as a no-tools takedown system"
    source: maker
  - label: Limb fitting
    value: Proprietary
    source: maker
  - label: Plunger threaded
    value: "Yes, published as pre-drilled with a plunger hole"
    source: maker
  - label: Weight mounting
    value: "Yes, published as a stabiliser bushing, with ATA accessory holes"
    source: maker
  - label: Riser
    value: 19 1/4 in laminated wood
    source: maker
  - label: Limbs
    value: Bamboo core with a maple wedge, black fibreglass face and back
    source: maker
  - label: Arrow rest
    value: Not stated. The listing describes no rest in the box
    source: maker
  - label: Replacement limbs
    value: None sold for the Ghost. 3Rivers staff state Edge limbs 2485X and Cairn limbs 868455X fit the Ghost riser
    source: retailer
  - label: Tiller
    value: Published by 3Rivers staff as no set tiller, built as close to 0 as possible
    source: retailer
  - label: Brace height
    value: Not on the specification. 3Rivers staff recommend 7 to 8 in, quieter nearer 8
    source: retailer
  - label: In the box
    value: Bow, Dacron string with finger savers fitted, bow stringer
    source: maker
  - label: Warranty
    value: None from 3Rivers Archery. Its policy points to the manufacturer, and this is a 3Rivers house brand
    source: retailer
  - label: Returns
    value: 30 days, customer pays return shipping. After 30 days a 20 percent restocking charge applies, minimum $5. 3Rivers Archery, read 25 August 2026
    source: retailer
affiliate:
  merchant: 3Rivers Archery
  placeholder: "[AFFILIATE: Ghost 62 Takedown Recurve Bow]"
limitation: The lightest published draw weight is 25 lb, heavier than four other bows on this page, the listing describes no arrow rest, and the contract manufacturer behind the house brand is not named.
suits: An archer who already draws 25 lb and wants a bamboo-core limb, a stringer in the box, and a published figure for how draw weight changes with draw length.
tradeoff: The Ghost 62" Takedown Recurve Bow ships a stringer and publishes both a plunger hole and a stabiliser bushing, but starts at 25 lb and describes no arrow rest at all.
