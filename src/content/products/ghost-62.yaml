limitation: The lightest published draw weight is 25 lb, heavier than four other bows on this page, the listing describes no arrow rest, and it names no manufacturer behind the brand.
suits: An archer who already draws 25 lb and wants a bamboo-core limb, a stringer in the box, and a published figure for how draw weight changes with draw length.
tradeoff: The Ghost 62" Takedown Recurve Bow ships a stringer and publishes both a plunger hole and a stabiliser bushing, but starts at 25 lb and describes no arrow rest at all.
