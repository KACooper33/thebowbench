limitation: The lightest published draw weight is 30 lb, which is heavy for a beginner, and the listing describes no arrow rest, no plunger bushing and no bushings of any kind. It also ships a string silencer that is not legal in World Archery barebow.
suits: An archer who already draws 30 lb comfortably and wants the cheapest route into ILF, where limbs come from the whole market rather than from one maker.
tradeoff: The Black Hunter ILF Recurve Bow is the only complete ILF bow on this site and costs less than the cheapest ILF riser and limb pair, but it starts at 30 lb and arrives with nothing to rest an arrow on.
