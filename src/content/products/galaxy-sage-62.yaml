limitation: The limb fitting is the Sage pattern rather than ILF, so heavier limbs must be Sage limbs, and the two brands publish different draw weight ranges for the same bow.
suits: An archer who wants a plunger bushing and a known upgrade path within one maker's range, at the price of a complete bow.
tradeoff: The Galaxy Sage 62" costs $9.97 less than the Black Hunter ILF and publishes a plunger bushing the ILF bow does not, in exchange for limbs that must come from one maker.
