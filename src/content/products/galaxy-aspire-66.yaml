limitation: The limbs stop at 35 lb, the lowest ceiling of any bow on this page, and they are not ILF, so replacement limbs come from one maker at $59.99. The listing describes no arrow rest and publishes no brace height, and the replacement limbs were backordered at two to three weeks when checked.
suits: A beginner who wants the lightest limbs sold on this page, a metal riser, and a published plunger provision, and who does not expect to shoot above 35 lb.
tradeoff: The Galaxy Aspire 66" Take-Down Recurve Bow is the only bow on this page whose seller publishes a mass weight and the only one starting at 15 lb, but its limbs stop at 35 lb where the Galaxy Sage 62" reaches 55 lb.
