# Specifications as published by Lancaster Archery Supply, 19 August 2026.
# Nothing here was measured on our own bench.
#
# This is the only bow on the takedown recurve page whose seller publishes a
# mass weight. That is worth noting rather than burying: the page says of the
# others that no listing states how heavy the bow is.
#
# The "ready for sight, clicker, plunger, and stabilizers" line is quoted as
# published. Three of those four fittings are banned in barebow. The page
# explains which, so a beginner does not buy fittings the division refuses.
