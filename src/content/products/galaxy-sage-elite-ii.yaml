limitation: It is the most expensive bow on this page at $199.98, and its two-pin limb pocket is described differently from the Galaxy Sage's single tapered knob, so limbs bought for one are not confirmed to fit the other.
suits: A beginner who wants the best documented bow on this page, with a published mass weight, a published brace height and bushings for a plunger.
tradeoff: The Galaxy Sage Elite II Takedown Recurve Bow is the only bow here whose seller publishes both a mass weight and a brace height, and it costs $50 more than the Galaxy Sage that shares its name.
