# Specifications as published by Lancaster Archery Supply, 2 September 2026.
# Nothing here was measured on our own bench.
#
# The name is the trap on this bow. Lancaster describes the Galaxy Sage as a
# "single tapered knob and metal limb pocket design" and the Sage Elite II as
# a "two-pin limb and limb pocket system". Two different fittings, described
# by the same seller, under the same model name.
#
# The page reports that as what each listing says. It does not claim the limbs
# will not interchange, because nobody here has tried a Sage limb in an Elite
# II riser.
#
# This is the only bow on the takedown page whose seller publishes both a mass
# weight and a brace height.
