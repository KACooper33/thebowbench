limitation: This is the same bow as the Galaxy Sage 62", so nothing about it is a separate design choice. Its seller publishes no mass weight, and its limb pocket is bolt-down, so heavier limbs come from one maker.
suits: Anyone who was going to buy the Galaxy Sage and would rather pay $39.99 less for the same bow under its original name.
tradeoff: The Samick Sage 62" Takedown Recurve Bow is $39.99 cheaper than the identical Galaxy Sage 62" and publishes a brace height the Galaxy listing omits, but it is sold by a seller that states no bow warranty.
