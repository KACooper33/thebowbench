# Specifications as published by Southland Archery Supply, 3 September 2026.
# Nothing here was measured on our own bench.
#
# This is the same bow as the Galaxy Sage 62" already on the takedown page.
# Galaxy is the United States brand for Samick-made bows, and the two listings
# describe the same limb pocket in the same words: "Single Tapered Knob and
# Metal Limb Pocket Design".
#
# It is carried as its own row because the two sell for different money and
# publish different things. Southland lists this at $109.99 where Lancaster
# lists the Galaxy Sage at $149.98, and Southland publishes a brace height
# that the Galaxy listing does not. A reader comparing prices should see both.
#
# Stock is not recorded. It varies by draw weight and hand and would be stale
# within a week.
