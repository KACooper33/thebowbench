limitation: The riser is not ILF, so heavier limbs must come from PSE rather than from the wider ILF market, and PSE's own store no longer lists the bow.
suits: A young archer whose parent wants a takedown bow that accepts a cushion plunger, and who can find one in stock.
tradeoff: The PSE Razorback Jr. is the only bow on this page published as threaded for a plunger alongside the Galaxy Little Fox, and it is the hardest of the six to buy.
