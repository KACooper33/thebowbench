# Specifications as published by 3Rivers Archery, 25 August 2026.
# Nothing here was measured on our own bench.
#
# Traditional Only is 3Rivers Archery's own brand, so the maker and the seller
# are the same business. Recorded here because "brand" and "manufacturer" are
# not the same thing, and a house brand is worth a reader knowing about.
#
# This is the first bow on the takedown recurve page whose seller publishes a
# brace height. Every other listing there leaves it out.
