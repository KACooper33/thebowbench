limitation: At $149.98 the Galaxy Little Fox is the most expensive bow on this page, and its published draw weights stop at 20 lb.
suits: A parent who wants one bow to last several years, in a choice of three lengths, with a plunger bushing already there.
tradeoff: The Galaxy Little Fox costs three times the cheapest bow here and is the only one besides the PSE Razorback Jr. published as taking a plunger.
