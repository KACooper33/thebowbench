# Specifications as published by Deerseeker Archery on its own site,
# 2 September 2026. Nothing here was measured on our own bench.
#
# The maker's site starts its range at 30 lb and its retail listing sells the
# same bow from 20 lb. Both are recorded rather than one being chosen, and
# neither is treated as an error: sellers list the weights they can ship and
# drop the ones they cannot, so a range that differs between two shops is
# usually a stock answer.
#
# That is deliberately not the same finding as the SAS Spirit, whose limbs
# page states a 2 lb derating for the 66 in bow that its own bow page omits.
# One is availability. The other changes what the buyer actually receives.
#
# Source titles for this bow are written by hand. The maker's own marketing
# copy and the Amazon listing title both carry out-of-scope terms that
# scripts/check-content.mjs fails the build on.
