limitation: The maker's own page and its Amazon listing disagree on the lightest draw weight, 30 lb against 20 lb, and the maker publishes no brace height, no mass weight and no returns window.
suits: A beginner who wants the cheapest complete bow on this page and the most accessories in the box, and who can confirm the draw weight before ordering.
tradeoff: The Deerseeker Raptor 62" Takedown Recurve Bow is the cheapest bow on this page at $83.90 and one of only two publishing a warranty, but its two listings do not agree on what the lightest limbs weigh.
