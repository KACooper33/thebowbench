limitation: The maker publishes no brace height, no mass weight and no returns window, and the lightest limbs it lists are 30 lb, so a buyer wanting 20 lb has to order from a retailer that stocks it.
suits: A beginner who wants the cheapest complete bow on this page and the most accessories in the box, and who is ordering from a listing that stocks the draw weight they need.
tradeoff: The Deerseeker Raptor 62" Takedown Recurve Bow is the cheapest bow on this page at $83.90 and one of only two publishing a warranty, but its maker publishes no brace height and no mass weight, and stocks nothing lighter than 30 lb.
