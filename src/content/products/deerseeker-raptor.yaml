# Specifications as published by Deerseeker Archery on its own site,
# 2 September 2026. Nothing here was measured on our own bench.
#
# The maker's site and its Amazon listing disagree on the lightest draw
# weight: 30 lb on the maker's page, 20 lb on the retail listing. Both are
# recorded rather than one being chosen. This is the third bow on the takedown
# page whose draw weight differs between two of its seller's own pages, after
# the Galaxy Sage and the SAS Spirit.
#
# Source titles for this bow are written by hand. The maker's own marketing
# copy and the Amazon listing title both carry out-of-scope terms that
# scripts/check-content.mjs fails the build on.
