limitation: The maker publishes less about this bow than any other on the page. No brace height, no mass weight, no bushings, no arrow rest, and a box listed as containing the bow alone. The limb fitting is a proprietary bolt-down pattern, so replacement limbs come from one maker.
suits: An adult beginner who wants the longest bow here at the lowest price, and who would rather have a published replacement limb price than a bag of accessories.
tradeoff: The SAS Spirit 66" Take Down Recurve Bow is the longest bow on this page and the only one whose maker publishes what replacement limbs cost, but its listing describes no rest, no bushings and no string in the box.
