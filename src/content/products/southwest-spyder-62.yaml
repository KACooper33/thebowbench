limitation: The listing states no limb fitting, so replacement limbs are not confirmed to come from anywhere but Southwest Archery, and it publishes no limb material, no brace height and no mass weight.
suits: A beginner who wants the widest published draw weight range on this page, starting at 16 lb, with a plunger and stabiliser bushing already fitted.
tradeoff: The Southwest Archery Spyder 62" Takedown Recurve Bow publishes bushings for a plunger and a stabiliser that the cheaper bows on this page do not, and still says nothing about what its limbs are made of.
